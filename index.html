                "name": "Are my photos uploaded to any server?",

                  "text": "Never. Everything runs locally inside your browser using the HTML5 Canvas API. Your photos never leave your phone or computer."

                "name": "Can I use my phone or laptop camera like a real photo booth?",

                "name": "What size is the downloaded photo strip?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Classic 4-frame vertical strips export as crisp 1200 x 3600 px PNG files. 3-frame strips export at 1200 x 2850 px, 2x2 grids at 1800 x 2250 px, and Polaroids at 1500 x 1860 px."
